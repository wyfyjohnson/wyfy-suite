pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroup('net.fabricmc')
                includeGroup('fabric-loom')
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Sponge'
                    url = uri('https://repo.spongepowered.org/repository/maven-public')
                }
            }
            filter {
                includeGroupAndSubgroups("org.spongepowered")
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Forge'
                    url = uri('https://maven.minecraftforge.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.minecraftforge')
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

// This should match the folder name of the project, or else IDEA may complain (see https://youtrack.jetbrains.com/issue/IDEA-317606)
rootProject.name = 'wyfy-suite'
z
// LibWyfy - shared library
include('libwyfy:common')
include('libwyfy:fabric')
include('libwyfy:neoforge')
include('libwyfy:forge')

// IvaldiOS - Primary Tech Mod
include('IvaldiOS:common')
include('IvaldiOS:fabric')
include('IvaldiOS:neoforge')
include('IvaldiOS:forge')

// DraupnirTech - Nuclear Tech Mod
include('DraupnirTech:common')
include('DraupnirTech:fabric')
include('DraupnirTech:neoforge')
include('DraupnirTech:forge')
